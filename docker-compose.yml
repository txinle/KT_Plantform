services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kt_platform}
      POSTGRES_USER: ${POSTGRES_USER:-kt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kt_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kt_user} -d ${POSTGRES_DB:-kt_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-kt_platform}
      DB_USER: ${POSTGRES_USER:-kt_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kt_password}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-kt_user} -d ${POSTGRES_DB:-kt_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: 0
      SEED_DEMO: ${SEED_DEMO:-0}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file: .env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: pgbouncer
      DATABASE_APPLICATION_NAME: kt-web
      DJANGO_DEBUG: 0
      VUE_STANDALONE_ENABLED: ${VUE_STANDALONE_ENABLED:-1}
      FRONTEND_INTERNAL_REDIRECT: /__frontend/index.html
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    build:
      context: .
      target: scheduler
    env_file: .env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: pgbouncer
      DATABASE_APPLICATION_NAME: kt-scheduler
      DJANGO_DEBUG: 0
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy

  analytics-worker:
    build:
      context: .
      target: analytics-worker
    env_file: .env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: pgbouncer
      DATABASE_APPLICATION_NAME: kt-analytics-worker
      DJANGO_DEBUG: 0
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${ANALYTICS_WORKER_CPUS:-0.75}
          memory: ${ANALYTICS_WORKER_MEMORY:-512M}

  publication-worker:
    build:
      context: .
      target: publication-worker
    env_file: .env
    restart: unless-stopped
    command: ["python", "manage.py", "run_publication_jobs"]
    environment:
      POSTGRES_HOST: pgbouncer
      DATABASE_APPLICATION_NAME: kt-publication-worker
      DJANGO_DEBUG: 0
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${PUBLICATION_WORKER_CPUS:-2}
          memory: ${PUBLICATION_WORKER_MEMORY:-2G}

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/media:ro
      - frontend_assets:/static/spa-assets/assets

volumes:
  postgres_data:
  frontend_assets:
  media_data:
