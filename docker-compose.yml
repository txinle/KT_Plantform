services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kt_platform}
      POSTGRES_USER: ${POSTGRES_USER:-kt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kt_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kt_user} -d ${POSTGRES_DB:-kt_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: web
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: 0
      SEED_DEMO: ${SEED_DEMO:-0}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: 0
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    build:
      context: .
      target: scheduler
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: 0
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/media:ro

volumes:
  postgres_data:
  media_data:
