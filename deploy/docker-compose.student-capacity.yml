# Apply after school.yml, school-test.yml, student-concurrency.yml and
# student-entry-sharing.yml to a NEW isolated project. Preserve S20/S24 baselines.
# New capacity experiments only; none of these defaults establish a capacity claim.
# Eight backend connections are reserved for overlap; drain old PgBouncer before
# replacing it if a full duplicate pool would exceed that allowance.
x-shared-environment: &shared-environment
  SCHOOL_POOL_PROFILE: ${SCHOOL_POOL_PROFILE:-shared-entry-v2}
  ASSESSMENT_PREPARED_ADMISSION_MODE: postgres_transaction
  ASSESSMENT_PREPARED_ENABLED: "1"
  ASSESSMENT_ADMISSION_ENABLED: "1"
  ASSESSMENT_ADMISSION_GLOBAL_ENABLED: "1"
  ASSESSMENT_ENTRY_WORKERS: ${ASSESSMENT_ENTRY_WORKERS:-15}
  ASSESSMENT_ENTRY_DB_CONNECTIONS: ${ASSESSMENT_ENTRY_DB_CONNECTIONS:-11}
  ASSESSMENT_ENTRY_LOGIN_LIMIT: ${ASSESSMENT_ENTRY_LOGIN_LIMIT:-12}
  ASSESSMENT_ENTRY_STARTUP_LIMIT: ${ASSESSMENT_ENTRY_STARTUP_LIMIT:-8}
  ASSESSMENT_ENTRY_HEAVY_LIMIT: ${ASSESSMENT_ENTRY_HEAVY_LIMIT:-14}
  ASSESSMENT_REMAINING_WORKERS: ${ASSESSMENT_REMAINING_WORKERS:-8}
  ASSESSMENT_REMAINING_DB_CONNECTIONS: ${ASSESSMENT_REMAINING_DB_CONNECTIONS:-8}
  ASSESSMENT_CAPTURE_WORKERS: ${ASSESSMENT_CAPTURE_WORKERS:-3}
  ASSESSMENT_CAPTURE_DB_CONNECTIONS: ${ASSESSMENT_CAPTURE_DB_CONNECTIONS:-3}
  ASSESSMENT_CORE_WORKERS: ${ASSESSMENT_CORE_WORKERS:-1}
  ASSESSMENT_CORE_DB_CONNECTIONS: ${ASSESSMENT_CORE_DB_CONNECTIONS:-1}
  ASSESSMENT_TEACHER_WORKERS: ${ASSESSMENT_TEACHER_WORKERS:-1}
  ASSESSMENT_TEACHER_DB_CONNECTIONS: ${ASSESSMENT_TEACHER_DB_CONNECTIONS:-1}
  ASSESSMENT_ENTRY_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_ENTRY_DB_RESERVE_CONNECTIONS:-0}
  ASSESSMENT_REMAINING_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_REMAINING_DB_RESERVE_CONNECTIONS:-2}
  ASSESSMENT_CAPTURE_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_CAPTURE_DB_RESERVE_CONNECTIONS:-1}
  ASSESSMENT_CORE_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_CORE_DB_RESERVE_CONNECTIONS:-0}
  ASSESSMENT_TEACHER_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_TEACHER_DB_RESERVE_CONNECTIONS:-0}
  ASSESSMENT_BACKGROUND_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_BACKGROUND_DB_RESERVE_CONNECTIONS:-0}
  ASSESSMENT_SUBMISSION_DB_RESERVE_CONNECTIONS: ${ASSESSMENT_SUBMISSION_DB_RESERVE_CONNECTIONS:-0}
  PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
  ASSESSMENT_ADMISSION_CAPACITY: ${ASSESSMENT_ADMISSION_CAPACITY:-8}
  ASSESSMENT_ADMISSION_RATE_PER_SECOND: ${ASSESSMENT_ADMISSION_RATE_PER_SECOND:-64}
  SCHOOL_REDIS_SESSION_ENABLED: "0"
  ASSESSMENT_SUBMISSION_WORKERS: ${ASSESSMENT_SUBMISSION_WORKERS:-4}
  ASSESSMENT_SUBMISSION_DB_CONNECTIONS: ${ASSESSMENT_SUBMISSION_DB_CONNECTIONS:-4}
  ASSESSMENT_ANALYTICS_WORKERS: ${ASSESSMENT_ANALYTICS_WORKERS:-1}
  ASSESSMENT_BACKGROUND_DB_CONNECTIONS: ${ASSESSMENT_BACKGROUND_DB_CONNECTIONS:-2}
  ASSESSMENT_ENTRY_STARTUP_RATE: ${ASSESSMENT_ENTRY_STARTUP_RATE:-64}
  ASSESSMENT_ENTRY_STARTUP_BURST: ${ASSESSMENT_ENTRY_STARTUP_BURST:-8}
  SCHOOL_DB_MAX_CONNECTIONS: ${SCHOOL_DB_MAX_CONNECTIONS:-64}
  SCHOOL_DB_RESERVED_CONNECTIONS: ${SCHOOL_DB_RESERVED_CONNECTIONS:-3}
  SCHOOL_DB_DIRECT_CONNECTIONS: ${SCHOOL_DB_DIRECT_CONNECTIONS:-1}
  SCHOOL_DB_MONITOR_CONNECTIONS: ${SCHOOL_DB_MONITOR_CONNECTIONS:-2}
  SCHOOL_DB_MAINTENANCE_CONNECTIONS: ${SCHOOL_DB_MAINTENANCE_CONNECTIONS:-2}
  SCHOOL_DB_ROLLING_OVERLAP_CONNECTIONS: ${SCHOOL_DB_ROLLING_OVERLAP_CONNECTIONS:-8}
  ADVANCED_DATA_MATERIALIZED_ENABLED: "1"
  ADVANCED_DATA_MATERIALIZED_COURSE_IDS: "*"
  CLASS_CENTER_ENABLED: "1"
  STUDENT_LEARNING_ANALYTICS_ENABLED: "1"
x-http-environment: &http-environment
  <<: *shared-environment
  DATABASE_CONN_MAX_AGE: ${SCHOOL_HTTP_CONN_MAX_AGE:-0}
  DATABASE_DISABLE_SERVER_SIDE_CURSORS: "1"

services:
  db:
    cpus: 0
    cpuset: ${SCHOOL_DB_CPUSET:-}
    mem_limit: ${SCHOOL_DB_MEMORY_LIMIT:-3G}
    command: !override ["postgres", "-c", "max_connections=${SCHOOL_DB_MAX_CONNECTIONS:-64}", "-c", "superuser_reserved_connections=${SCHOOL_DB_RESERVED_CONNECTIONS:-3}", "-c", "shared_buffers=768MB",
      "-c", "effective_cache_size=2GB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB",
      "-c", "autovacuum_work_mem=64MB", "-c", "max_wal_size=2GB", "-c", "checkpoint_completion_target=0.9",
      "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
  entry:
    cpuset: ${ASSESSMENT_ENTRY_CPUSET:-}
    mem_limit: ${ASSESSMENT_ENTRY_MEMORY_LIMIT:-4096M}
    extends:
      file: docker-compose.school.yml
      service: auth
    env_file: !override [school-test.env]
    cgroup_parent: ktconcurrency.slice
    cpus: 0
    cpu_shares: 4608
    environment:
      <<: *http-environment
      GUNICORN_WORKERS: ${ASSESSMENT_ENTRY_WORKERS:-15}
      POSTGRES_POOL_ALIAS: kt_entry
      POSTGRES_DB: kt_e2e
      DATABASE_APPLICATION_NAME: kt-school-entry
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:18082,http://localhost:18082
      CANONICAL_PUBLIC_ORIGIN: ""
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SESSION_COOKIE_SECURE: "0"
      DJANGO_CSRF_COOKIE_SECURE: "0"
    depends_on: !override
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
  auth:
    profiles: [student-entry-split-disabled]
  startup:
    profiles: [student-entry-split-disabled]
  student-read:
    profiles: [student-entry-split-disabled]
  pgbouncer:
    cpuset: ${SCHOOL_PGBOUNCER_CPUSET:-}
    mem_limit: ${SCHOOL_PGBOUNCER_MEMORY_LIMIT:-128M}
    cpus: 0
    environment:
      <<: *shared-environment
    volumes:
      - ./docker/pgbouncer-school-capacity.ini.template:/school/pgbouncer.ini.template:ro
  migrate:
    command: !override ["sh", "-c", "python manage.py migrate --noinput && python manage.py prepare_assessment_event_schemas && python manage.py collectstatic --noinput"]
    environment:
      <<: *shared-environment
  web:
    cpuset: ${ASSESSMENT_CORE_CPUSET:-}
    mem_limit: ${ASSESSMENT_CORE_MEMORY_LIMIT:-512M}
    cpus: 0
    environment:
      <<: *http-environment
      GUNICORN_WORKERS: ${ASSESSMENT_CORE_WORKERS:-1}
  assessment:
    cpuset: ${ASSESSMENT_REMAINING_CPUSET:-}
    mem_limit: ${ASSESSMENT_REMAINING_MEMORY_LIMIT:-3072M}
    cpus: 0
    environment:
      <<: *http-environment
      GUNICORN_WORKERS: ${ASSESSMENT_REMAINING_WORKERS:-8}
  capture:
    cpuset: ${ASSESSMENT_CAPTURE_CPUSET:-}
    mem_limit: ${ASSESSMENT_CAPTURE_MEMORY_LIMIT:-1280M}
    cpus: 0
    environment:
      <<: *http-environment
      GUNICORN_WORKERS: ${ASSESSMENT_CAPTURE_WORKERS:-3}
  teacher-read:
    cpuset: ${ASSESSMENT_TEACHER_CPUSET:-}
    mem_limit: ${ASSESSMENT_TEACHER_MEMORY_LIMIT:-512M}
    cpus: 0
    environment:
      <<: *http-environment
      GUNICORN_WORKERS: ${ASSESSMENT_TEACHER_WORKERS:-1}
  scheduler:
    cpuset: ${SCHOOL_SCHEDULER_CPUSET:-}
    mem_limit: ${SCHOOL_SCHEDULER_MEMORY_LIMIT:-256M}
    cpus: 0
    environment:
      <<: *shared-environment
      POSTGRES_HOST: db
      POSTGRES_POOL_ALIAS: ""
      DATABASE_CONN_MAX_AGE: 0
  session-submission-worker:
    cpuset: ${ASSESSMENT_SUBMISSION_CPUSET:-}
    mem_limit: ${ASSESSMENT_SUBMISSION_MEMORY_LIMIT:-384M}
    cpus: 0
    cpu_shares: 2048
    deploy:
      replicas: ${ASSESSMENT_SUBMISSION_WORKERS:-4}
      resources:
        limits:
          cpus: "0"
          memory: ${ASSESSMENT_SUBMISSION_MEMORY_LIMIT:-384M}
    environment:
      <<: *shared-environment
      DATABASE_CONN_MAX_AGE: 0
  analytics-worker:
    cpuset: ${ASSESSMENT_ANALYTICS_CPUSET:-}
    mem_limit: ${ASSESSMENT_ANALYTICS_MEMORY_LIMIT:-1G}
    profiles: !override []
    cgroup_parent: ktconcurrency.slice
    cpus: 0
    cpu_shares: 512
    deploy:
      replicas: ${ASSESSMENT_ANALYTICS_WORKERS:-1}
      resources:
        limits:
          cpus: "0"
          memory: ${ASSESSMENT_ANALYTICS_MEMORY_LIMIT:-1G}
    environment:
      <<: *shared-environment
      DATABASE_CONN_MAX_AGE: 0
  nginx:
    cpuset: ${SCHOOL_NGINX_CPUSET:-}
    mem_limit: ${SCHOOL_NGINX_MEMORY_LIMIT:-128M}
    cpus: 0
    environment:
      NGINX_ENVSUBST_FILTER: ^ASSESSMENT_ENTRY_
      ASSESSMENT_ENTRY_LOGIN_LIMIT: ${ASSESSMENT_ENTRY_LOGIN_LIMIT:-12}
      ASSESSMENT_ENTRY_STARTUP_LIMIT: ${ASSESSMENT_ENTRY_STARTUP_LIMIT:-8}
      ASSESSMENT_ENTRY_HEAVY_LIMIT: ${ASSESSMENT_ENTRY_HEAVY_LIMIT:-14}
      ASSESSMENT_ENTRY_STARTUP_RATE: ${ASSESSMENT_ENTRY_STARTUP_RATE:-64}
      ASSESSMENT_ENTRY_STARTUP_BURST: ${ASSESSMENT_ENTRY_STARTUP_BURST:-8}
    # Replaces the read-only default.conf mount, allowing the stock Nginx
    # entrypoint to render only the explicitly filtered limit variables.
    volumes: !override
      - ./nginx/kt-school-capacity.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/frontend-pages.conf:/etc/nginx/frontend-pages.conf:ro
      - backend_static:/backend-static:ro
      - frontend_assets:/static/spa-assets/assets
      - media_data:/media:ro
    depends_on: !override
      web: {condition: service_healthy}
      entry: {condition: service_healthy}
      assessment: {condition: service_healthy}
      capture: {condition: service_healthy}
      teacher-read: {condition: service_healthy}
