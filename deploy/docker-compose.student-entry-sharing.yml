# Apply after school.yml, school-test.yml and student-concurrency.yml to a NEW
# isolated project. S20 is default; S24 changes entry workers/login/heavy to 15/12/14.
x-shared-environment: &shared-environment
  SCHOOL_POOL_PROFILE: shared-entry-v1
  ASSESSMENT_PREPARED_ADMISSION_MODE: postgres_transaction
  ASSESSMENT_PREPARED_ENABLED: "1"
  ASSESSMENT_ADMISSION_ENABLED: "1"
  ASSESSMENT_ADMISSION_GLOBAL_ENABLED: "1"
  ASSESSMENT_ENTRY_WORKERS: ${ASSESSMENT_ENTRY_WORKERS:-11}
  ASSESSMENT_ENTRY_DB_CONNECTIONS: "11"
  ASSESSMENT_ENTRY_LOGIN_LIMIT: ${ASSESSMENT_ENTRY_LOGIN_LIMIT:-8}
  ASSESSMENT_ENTRY_STARTUP_LIMIT: "8"
  ASSESSMENT_ENTRY_HEAVY_LIMIT: ${ASSESSMENT_ENTRY_HEAVY_LIMIT:-10}
  ASSESSMENT_REMAINING_WORKERS: "4"
  ASSESSMENT_REMAINING_DB_CONNECTIONS: "4"
  ASSESSMENT_CAPTURE_WORKERS: "3"
  ASSESSMENT_CAPTURE_DB_CONNECTIONS: "3"
  ASSESSMENT_ADMISSION_CAPACITY: "8"
  ASSESSMENT_ADMISSION_RATE_PER_SECOND: "64"
  SCHOOL_REDIS_SESSION_ENABLED: "0"

services:
  entry:
    extends:
      file: docker-compose.school.yml
      service: auth
    env_file: !override [school-test.env]
    cgroup_parent: ktconcurrency.slice
    cpus: 0
    cpu_shares: 4608
    mem_limit: 3456M
    environment:
      <<: *shared-environment
      GUNICORN_WORKERS: ${ASSESSMENT_ENTRY_WORKERS:-11}
      POSTGRES_POOL_ALIAS: kt_entry
      POSTGRES_DB: kt_e2e
      DATABASE_APPLICATION_NAME: kt-school-entry
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:18082,http://localhost:18082
      CANONICAL_PUBLIC_ORIGIN: ""
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SESSION_COOKIE_SECURE: "0"
      DJANGO_CSRF_COOKIE_SECURE: "0"
    depends_on: !override
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
  auth:
    profiles: [student-entry-split-disabled]
  startup:
    profiles: [student-entry-split-disabled]
  student-read:
    profiles: [student-entry-split-disabled]
  pgbouncer:
    environment:
      <<: *shared-environment
    volumes:
      - ./docker/pgbouncer-school-shared.ini.template:/school/pgbouncer.ini.template:ro
  migrate:
    environment:
      <<: *shared-environment
  web:
    environment:
      <<: *shared-environment
  assessment:
    environment:
      <<: *shared-environment
      GUNICORN_WORKERS: "4"
  capture:
    environment:
      <<: *shared-environment
      GUNICORN_WORKERS: "3"
  teacher-read:
    environment:
      <<: *shared-environment
  scheduler:
    environment:
      <<: *shared-environment
  session-submission-worker:
    environment:
      <<: *shared-environment
  nginx:
    environment:
      NGINX_ENVSUBST_FILTER: ^ASSESSMENT_ENTRY_
      ASSESSMENT_ENTRY_LOGIN_LIMIT: ${ASSESSMENT_ENTRY_LOGIN_LIMIT:-8}
      ASSESSMENT_ENTRY_STARTUP_LIMIT: "8"
      ASSESSMENT_ENTRY_HEAVY_LIMIT: ${ASSESSMENT_ENTRY_HEAVY_LIMIT:-10}
    # Replaces the read-only default.conf mount, allowing the stock Nginx
    # entrypoint to render only the explicitly filtered limit variables.
    volumes: !override
      - ./nginx/kt-school-shared-entry.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/frontend-pages.conf:/etc/nginx/frontend-pages.conf:ro
      - backend_static:/backend-static:ro
      - frontend_assets:/static/spa-assets/assets
      - media_data:/media:ro
    depends_on: !override
      web: {condition: service_healthy}
      entry: {condition: service_healthy}
      assessment: {condition: service_healthy}
      capture: {condition: service_healthy}
      teacher-read: {condition: service_healthy}
