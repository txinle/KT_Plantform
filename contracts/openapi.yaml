          type: string
        filters:
          $ref: '#/components/schemas/TeachingLegacyFilters'
        total_roster_count:
          type: integer
          minimum: 0
        student_summaries:
          type: array
          items:
            $ref: '#/components/schemas/TeachingLegacyStudentSummary'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TeachingLegacySession'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/TeachingLegacyAttempt'
      required:
      - attempts
      - blocked_message
      - course
      - filters
      - scope
      - sessions
      - student_summaries
      - total_roster_count
    TeachingLegacyScope:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: integer
        experiment_id:
          type: integer
          nullable: true
        class_id:
          type: integer
          nullable: true
        is_complete:
          type: boolean
        display:
          type: string
      required:
      - class_id
      - display
      - experiment_id
      - is_complete
      - values
    TeachingLegacySession:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        status_label:
          type: string
        attempt_count:
          type: integer
          minimum: 0
        submitted_count:
          type: integer
          minimum: 0
        started_at:
          type: string
          format: date-time
      required:
      - attempt_count
      - id
      - started_at
      - status
      - status_label
      - submitted_count
    TeachingLegacyStudentSummary:
      type: object
      properties:
        student_id:
          type: integer
        student_number:
          type: string
        display_name:
          type: string
        data_status:
          type: string
        data_status_label:
          type: string
        attempt_count:
          type: integer
          nullable: true
        submitted_count:
          type: integer
          nullable: true
        graded_count:
          type: integer
          nullable: true
        correct_rate:
          type: integer
          nullable: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          nullable: true
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          nullable: true
      required:
      - attempt_count
      - correct_rate
      - data_status
      - data_status_label
      - display_name
      - graded_count
      - max_score
      - score
      - student_id
      - student_number
      - submitted_count
    TeachingLegacyTimelineEvent:
      type: object
      properties:
        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        interval_quality:
          type: string
      required:
      - event_id
      - event_type
      - interval_quality
      - occurred_at
    TeachingLegacyTiming:
      type: object
      properties:
        display_duration_ms:
          type: integer
          nullable: true
        display_label:
          type: string
      required:
      - display_duration_ms
      - display_label
    TimeModeEnum:
      enum:
      - none
      - total
      - per_question
      type: string
      description: |-
        * `none` - 无时限
        * `total` - 实验总时限
        * `per_question` - 单题时限
    TimingQuality:
      type: object
      properties:
        submitted_count:
          type: integer
          minimum: 0
        exact_count:
          type: integer
          minimum: 0
        estimated_count:
          type: integer
          minimum: 0
        wall_clock_count:
          type: integer
          minimum: 0
        unavailable_count:
          type: integer
          minimum: 0
      required:
      - estimated_count
      - exact_count
      - submitted_count
      - unavailable_count
      - wall_clock_count
    Transition:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
      required:
      - count
      - key
      - label
    TransitionApplicabilityEnum:
      enum:
      - applicable
      - not_applicable
      type: string
      description: |-
        * `applicable` - applicable
        * `not_applicable` - not_applicable
    TransitionEntryCapability:
      type: object
      properties:
        enabled:
          type: boolean
        version:
          type: integer
      required:
      - enabled
      - version
    VisibilityE8aEnum:
      enum:
      - private
      - shared
      - archived
      type: string
      description: |-
        * `private` - private
        * `shared` - shared
        * `archived` - archived
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django same-origin session. Unsafe methods also require X-CSRFToken.
