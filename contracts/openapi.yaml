        required: true
      tags:
      - Student mutations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_instance_id:
                  type: string
                  format: uuid
              additionalProperties: false
              required:
              - client_instance_id
        required: true
      security:
      - SessionAuth: []
      responses:
        '401':
