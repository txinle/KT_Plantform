  /api/v1/assessment/process/attempts/{attempt_id}/writer-lease/release/:
    post:
      operationId: assessment_writer_lease_release
      description: Release the matching lease; optional close bundle commits original
        recording evidence, checkpoints and release together. capture_operation_id
        replays its immutable durable receipt.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token paired with the csrftoken cookie; required
          for JSON POST.
      - in: header
        name: X-Request-ID
        schema:
          type: string
        description: Optional 32-character hexadecimal correlation ID.
      - in: path
        name: attempt_id
        schema:
          type: integer
        required: true
      tags:
      - Student mutations
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  lease_token:
                    type: string
                    format: uuid
                  client_instance_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - client_instance_id
                - lease_token
              - type: object
                properties:
                  lease_token:
                    type: string
                    format: uuid
                  client_instance_id:
                    type: string
                    format: uuid
                  capture_bundle:
                    type: object
                    properties:
                      version:
                        type: integer
                        enum:
                        - 1
                      client_instance_id:
                        type: string
                        format: uuid
                      event_boundary:
                        type: integer
                        minimum: 0
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            event_id:
                              type: string
                              format: uuid
                            event_type:
                              type: string
                              enum:
                              - activity_heartbeat
                              - confidence_observed
                              - document_hidden
                              - document_visible
                              - explanation_shown
                              - feedback_exposure
                              - feedback_shown
                              - hint_closed
                              - hint_opened
                              - input_operation
                              - item_left
                              - item_rendered
                              - legacy_session_end_observed
                              - legacy_session_start_observed
                              - network_offline
                              - network_online
                              - pagehide
                              - pageshow
                              - research_tool_observed
                              - research_tool_requested
                              - resource_closed
                              - resource_opened
                              - response_commit_requested
                              - response_input_started
                              - response_state_changed
                              - response_transition
                              - session_completed
                              - session_expired
                              - session_invalidated
                              - session_reopened
                              - session_started
                              - simulation_error_returned
                              - simulation_parameter_changed
                              - simulation_run_completed
                              - simulation_run_started
                              - text_edit_observed
                              - window_blurred
                              - window_focused
                            event_version:
                              type: integer
                              minimum: 1
                            session_id:
                              type: integer
                              minimum: 1
                            attempt_id:
                              type: integer
                              minimum: 1
                              nullable: true
                            client_sequence_no:
                              type: integer
                              minimum: 1
                            correlation_id:
                              type: string
                              format: uuid
                              nullable: true
                            client_wall_time_utc:
                              type: string
                              format: date-time
                              description: Timezone-aware timestamp.
                            client_monotonic_ms:
                              oneOf:
                              - type: number
                                minimum: 0
                              - type: string
                              description: Finite nonnegative decimal, validated by
                                the existing domain parser.
                            client_time_origin:
                              type: string
                              format: date-time
                              description: Timezone-aware timestamp.
                            time_sync_id:
                              type: string
                              format: uuid
                              nullable: true
                            quality_flags:
                              type: array
                              items:
                                type: string
                            app_version:
                              type: string
                              maxLength: 64
                            payload:
                              type: object
                              additionalProperties: true
                              description: Versioned payload validated by apps.assessment.event_schema_registry;
                                the authoritative JSON schemas are assessment/event_schemas/<event_type>/v<event_version>.json.
                          additionalProperties: false
                          required:
                          - app_version
                          - client_monotonic_ms
                          - client_sequence_no
                          - client_time_origin
                          - client_wall_time_utc
                          - event_type
                          - event_version
                          - payload
                          - quality_flags
                          - session_id
                        maxItems: 100
                      checkpoints:
                        type: array
                        items:
                          type: object
                          properties:
                            checkpoint_id:
                              type: string
                              format: uuid
                            session_id:
                              type: integer
                              minimum: 1
                            client_instance_id:
                              type: string
                              format: uuid
                            highest_emitted_sequence_no:
                              type: integer
                              minimum: 0
                            highest_acked_sequence_no:
                              type: integer
                              minimum: 0
                            highest_contiguous_acked_sequence_no:
                              type: integer
                              minimum: 0
                            pending_event_count:
                              type: integer
                              minimum: 0
                            failed_event_count:
                              type: integer
                              minimum: 0
                            missing_local_sequence_ranges:
                              type: array
                              items:
                                type: array
                                items:
                                  type: integer
                                  minimum: 1
                                minItems: 2
                                maxItems: 2
                            client_monotonic_ms:
                              oneOf:
                              - type: number
                                minimum: 0
                              - type: string
                              description: Finite nonnegative decimal, validated by
                                the existing domain parser.
                            client_wall_time_utc:
                              type: string
                              format: date-time
                              description: Timezone-aware timestamp.
                            client_time_origin:
                              type: string
                              format: date-time
                              description: Timezone-aware timestamp.
                            time_sync_id:
                              type: string
                              format: uuid
                              nullable: true
                            trigger:
                              type: string
                              enum:
                              - heartbeat
                              - navigation
                              - commit
                              - pagehide
                              - resume
                              - session_end
                              - ack_progress
                            quality_flags:
                              type: array
                              items:
                                type: string
                            app_version:
                              type: string
                              maxLength: 64
                          additionalProperties: false
                          required:
                          - app_version
                          - checkpoint_id
                          - client_instance_id
                          - client_monotonic_ms
                          - client_time_origin
                          - client_wall_time_utc
                          - failed_event_count
                          - highest_acked_sequence_no
                          - highest_contiguous_acked_sequence_no
                          - highest_emitted_sequence_no
                          - missing_local_sequence_ranges
                          - pending_event_count
                          - quality_flags
                          - session_id
                          - time_sync_id
                          - trigger
                        maxItems: 100
                    additionalProperties: false
                    required:
                    - checkpoints
                    - client_instance_id
                    - event_boundary
                    - events
                    - version
                    description: Original bounded capture facts; maximum complete
                      body 8388608 bytes. Batch facts share one owned session; draft/tool
                      facts belong to the current attempt or session.
                  capture_operation_id:
                    type: string
                    format: uuid
                  leave_event_id:
                    type: string
                    format: uuid
                  next_entry:
                    type: object
                    properties:
                      assignment_id:
                        type: integer
                        minimum: 1
                      reason:
                        type: string
                        enum:
                        - navigation_click
                        - resume
                      navigation_id:
                        type: string
                        format: uuid
                      client_occurred_at:
                        type: string
                        format: date-time
                        description: Timezone-aware timestamp.
                      client_monotonic_ms:
                        oneOf:
                        - type: number
                          minimum: 0
                        - type: string
                        description: Finite nonnegative decimal, validated by the
                          existing domain parser.
                      client_time_origin:
                        type: string
                        format: date-time
                        description: Timezone-aware timestamp.
                    additionalProperties: false
                    required:
                    - assignment_id
                    - client_monotonic_ms
                    - client_occurred_at
                    - client_time_origin
                    - navigation_id
                    - reason
                    description: Frozen target entry for a session that selected transition
                      protocol v1 at creation. Executed after the source mutation
                      commits, using a separate transaction and current deadline checks.
                additionalProperties: false
                required:
                - capture_bundle
                - capture_operation_id
                - client_instance_id
                - lease_token
                - leave_event_id
        required: true
      security:
      - SessionAuth: []
      responses:
        '401':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      fields:
                        type: object
                        additionalProperties: {}
                      request_id:
                        type: string
          description: Authentication required.
        '403':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      fields:
                        type: object
                        additionalProperties: {}
                      request_id:
                        type: string
          description: Role/CSRF authorization rejected.
        '405':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      fields:
                        type: object
                        additionalProperties: {}
                      request_id:
                        type: string
          description: Only POST is allowed.
        '400':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
