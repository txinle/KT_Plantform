          type: integer
        required: true
      tags:
      - Student mutations
      security:
      - SessionAuth: []
      responses:
        '401':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      fields:
                        type: object
                        additionalProperties: {}
                      request_id:
                        type: string
          description: Authentication required.
        '403':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      fields:
                        type: object
                        additionalProperties: {}
                      request_id:
                        type: string
          description: Role/CSRF authorization rejected.
        '405':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - fields
                    - request_id
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      fields:
                        type: object
                        additionalProperties: {}
                      request_id:
                        type: string
          description: Only POST is allowed.
        '409':
          content:
            application/json:
              schema:
                type: object
                required:
