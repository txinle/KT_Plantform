name: CI

on:
  push:
  pull_request:

env:
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: '5432'
  POSTGRES_DB: kt_platform
  POSTGRES_USER: kt_user
  POSTGRES_PASSWORD: kt_password

jobs:
  backend:
    defaults:
      run:
        working-directory: server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kt_platform
          POSTGRES_USER: kt_user
          POSTGRES_PASSWORD: kt_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kt_user -d kt_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py export_api_schema --check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  postgresql-contracts:
    defaults:
      run:
        working-directory: server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kt_platform
          POSTGRES_USER: kt_user
          POSTGRES_PASSWORD: kt_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kt_user -d kt_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: kt_platform
      POSTGRES_USER: kt_user
      POSTGRES_PASSWORD: kt_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: >-
          python manage.py test
          apps.experiments.test_a_plus_publication
          apps.experiments.test_a_plus_migration_contract
          apps.experiments.tests_postgresql_publish
          apps.assessment.test_deadline_decisions
          apps.assessment.tests_postgresql_events
          apps.assessment.tests_postgresql_enrollment_race
          apps.analytics.test_export_lineage_v2.ExportLineageV2Tests.test_outer_read_committed_transaction_is_rejected_for_source_freeze

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm run test:unit
        working-directory: client
      - run: npm run test:scripts
        working-directory: client
      - run: npm run api:check
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: application
            config: playwright.config.ts
          - profile: capture-v2
            config: playwright.capture-v2.config.ts
          - profile: capture-initialization
            config: playwright.capture-initialization.config.ts
          - profile: submission-repair
            config: playwright.submission-repair.config.ts
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kt_e2e
          POSTGRES_USER: kt_user
          POSTGRES_PASSWORD: kt_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kt_user -d kt_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: kt_user
      POSTGRES_PASSWORD: kt_password
      POSTGRES_DB: kt_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: python -m venv server/.venv && server/.venv/bin/python -m pip install -r server/requirements.txt
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: client
      - name: Run browser end-to-end tests
        run: |
          npm run test:scripts
          npm run build
          npm run build:check
          node scripts/prepare-e2e.mjs --capture-v2
          npx playwright test --config ${{ matrix.config }}
        working-directory: client
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-failure-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            client/.e2e-results/
            client/playwright-report/
          if-no-files-found: warn
          retention-days: 7
