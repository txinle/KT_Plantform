<div class="form-field{% if field.errors %} has-error{% endif %}" data-field-name="{{ field.name }}">
  <label class="form-label" for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required %}<span class="required-mark">必填</span>{% else %}<span class="optional-mark">可选</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="form-help" id="{{ field.id_for_label }}_help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error" id="{{ field.id_for_label }}_error">{{ error }}</div>{% endfor %}
</div>
