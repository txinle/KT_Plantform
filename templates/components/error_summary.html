{% if form.errors %}
  <div class="error-summary" role="alert" tabindex="-1" data-error-summary>
    <h2 class="error-summary-title">请检查以下内容</h2>
    {% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}
    <ul class="mb-0">
      {% for field in form %}
        {% for error in field.errors %}
          <li><a href="#{{ field.id_for_label }}">{{ field.label }}：{{ error }}</a></li>
        {% endfor %}
      {% endfor %}
    </ul>
  </div>
{% endif %}
