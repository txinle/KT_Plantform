{% extends 'base.html' %}{% block content %}<div class="mb-3"><a href="{% url 'question_bank:bank_detail' bank.pk %}">← 返回 {{ bank.name }}</a></div><div class="card"><div class="card-header">编辑题目 {{ question.code }}</div><div class="card-body"><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="{% if 'option_' in field.name %}col-md-6{% else %}col-12{% endif %}"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}</div>{% endfor %}</div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">保存</button><a class="btn btn-outline-secondary" href="{% url 'question_bank:bank_detail' bank.pk %}">取消</a></div></form></div></div>{% endblock %}
