{% extends 'base.html' %}{% block content %}<h1 class="page-title mb-3">KC 知识点库</h1><div class="card"><div class="card-body p-0"><table class="table mb-0"><thead><tr><th>名称</th><th>范围</th><th>创建者</th><th>关联题目</th></tr></thead><tbody>{% for c in concepts %}<tr><td>{{ c.name }}</td><td>{{ c.get_scope_display }}</td><td>{{ c.owner.shown_name|default:'管理员' }}</td><td>{{ c.questions.count }}</td></tr>{% empty %}<tr><td colspan="4" class="empty-state">KC 会在导入对应表时自动生成</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
