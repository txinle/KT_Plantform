{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="page-title mb-0">实验</h1><a class="btn btn-primary" href="{% url 'experiments:create' %}">新建实验</a></div><div class="card"><div class="card-body p-0"><table class="table mb-0"><thead><tr><th>实验</th><th>题库</th><th>排序</th><th>学生</th><th>状态</th><th></th></tr></thead><tbody>{% for e in experiments %}<tr><td><strong>{{ e.name }}</strong></td><td>{{ e.question_bank }}</td><td>{{ e.get_ordering_mode_display }}</td><td>{{ e.students.count }}</td><td>{{ e.get_status_display }}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'experiments:detail' e.pk %}">管理</a></td></tr>{% empty %}<tr><td colspan="6" class="empty-state">尚未创建实验</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
