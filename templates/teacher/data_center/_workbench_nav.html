<nav class="data-workbench-nav" aria-label="数据中心导航">
  {% for item in data_navigation %}
    <a class="data-workbench-nav-link{% if item.active %} active{% endif %}" href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
  {% endfor %}
</nav>

<section class="data-scope-bar" aria-label="当前数据范围">
  <div class="data-scope-summary">
    <span class="data-scope-label">范围</span>
    <strong>{{ scope_display }}</strong>
    {% if scope_is_temporary %}<span class="data-scope-extra">临时范围</span><a class="data-scope-reset" href="{{ request.path }}">恢复默认范围</a>{% elif scope_has_remembered_default %}<span class="data-scope-extra">已记忆范围</span>{% else %}<span class="data-scope-extra">未选择范围</span>{% endif %}
  </div>
  <details class="data-scope-editor"{% if not teaching_scope.is_complete %} open{% endif %}>
    <summary>更改范围</summary>
    <form method="post" action="{% url 'courses:data_scope_update' course.pk %}" class="data-teaching-scope-form mt-2">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <div>
        <label class="form-label" for="scope-experiment">实验</label>
        <select class="form-select" id="scope-experiment" name="experiment_id">
          <option value="">选择实验</option>
          {% for experiment in experiments %}
            <option value="{{ experiment.pk }}"{% if teaching_scope.experiment_id == experiment.pk %} selected{% endif %}>{{ experiment.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="form-label" for="scope-class">班级</label>
        <select class="form-select" id="scope-class" name="class_id">
          <option value="">选择班级</option>
          {% for class_group in teaching_classes %}
            <option value="{{ class_group.pk }}"{% if teaching_scope.class_id == class_group.pk %} selected{% endif %}>{{ class_group.academic_year }} {{ class_group.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="data-teaching-scope-action">
        <button class="btn btn-primary" type="submit">应用</button>
      </div>
    </form>
  </details>
</section>
