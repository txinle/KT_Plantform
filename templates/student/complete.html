{% extends 'base.html' %}{% block content %}<div class="card mx-auto" style="max-width:720px"><div class="card-body p-5 text-center"><div class="display-5 mb-3">✓</div><h1 class="page-title">{{ session.version.experiment.name }}</h1><p class="text-muted">当前会话状态：{{ session.get_status_display }}</p><div class="row g-3 my-4"><div class="col-6"><div class="border rounded-3 p-3"><div class="metric">{{ session.submission_count }}</div><div class="text-muted">已提交题目</div></div></div><div class="col-6"><div class="border rounded-3 p-3"><div class="metric">{{ session.attempts.count }}</div><div class="text-muted">分配题目</div></div></div></div><a href="{% url 'assessment:dashboard' %}" class="btn btn-primary">返回实验列表</a></div></div>{% endblock %}
