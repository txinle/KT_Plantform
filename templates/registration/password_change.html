{% extends "base.html" %}
{% block title %}修改初始密码{% endblock %}
{% block content %}
<main class="container py-5">
  <section class="card mx-auto p-4" style="max-width:32rem" aria-labelledby="password-change-title">
    <h1 id="password-change-title" class="h4">请先修改初始密码</h1>
    <p>修改成功后才能继续使用学生端。新密码至少 8 个字符，不能与当前密码或初始密码相同。</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">修改密码并继续</button>
    </form>
    <form method="post" action="{% url 'logout' %}" class="mt-3">
      {% csrf_token %}<button type="submit" class="btn btn-outline-secondary">退出登录</button>
    </form>
  </section>
</main>
{% endblock %}
