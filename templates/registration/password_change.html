{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<main class="container py-5">
  <section class="card mx-auto p-4" style="max-width:32rem" aria-labelledby="password-change-title">
    <h1 id="password-change-title" class="h4">修改密码</h1>
    <p>请输入当前密码并设置新密码。新密码至少 8 个字符，且不能与当前密码相同。</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">保存新密码</button>
    </form>
    <form method="post" action="{% url 'logout' %}" class="mt-3">
      {% csrf_token %}<button type="submit" class="btn btn-outline-secondary">退出登录</button>
    </form>
  </section>
</main>
{% endblock %}
