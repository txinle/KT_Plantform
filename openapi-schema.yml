        name: assignment_id
        schema:
          type: integer
        required: true
      - in: query
        name: client_monotonic_ms
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
      - in: query
        name: client_occurred_at
        schema:
          type: string
          format: date-time
      - in: query
        name: client_time_origin
        schema:
          type: string
          format: date-time
      - in: query
        name: navigation_id
        schema:
          type: string
          format: uuid
      - in: query
        name: reason
        schema:
          type: string
          default: navigation_click
          maxLength: 32
          minLength: 1
      - in: path
