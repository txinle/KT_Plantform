server {
    listen 80;
    server_name _;
    client_max_body_size 20M;
    location = /assessment/process/capture-v2/offline-worker.js {
        alias /static/spa-assets/capture-v2-offline-worker.js;
        add_header Service-Worker-Allowed "/student/sessions/";
        add_header Cache-Control "no-cache";
    }
    location = /__frontend/index.html {
        internal;
        alias /static/spa-assets/index.html;
        add_header Cache-Control "no-store" always;
    }
    location = /__frontend/capture-v2.html {
        internal;
        alias /static/spa-assets/index.html;
        add_header X-Capture-Contract "capture-v2";
        add_header Cache-Control "no-store" always;
    }
    location /static/ { alias /static/; expires 7d; }
    location /media/ { alias /media/; expires 1d; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
