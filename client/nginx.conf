server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/static/spa-assets/(capture-shell-[a-f0-9]{20}\.html)$ {
        alias /static/spa-assets/assets/shells/$1;
        add_header Cache-Control "no-cache";
    }

    location = /assessment/process/capture-v2/offline-worker.js {
        alias /static/spa-assets/capture-v2-offline-worker.js;
        default_type application/javascript;
        add_header Service-Worker-Allowed "/student/sessions/" always;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        alias /static/;
    }

    location / {
        try_files $uri =404;
    }
}
